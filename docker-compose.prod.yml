version: '3.8'

services:
  quantchain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ghcr.io/quantchain/quantchain:latest
    container_name: quantchain-production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Database configuration
      - DATABASE_URL=${DATABASE_URL}
      # Redis configuration
      - REDIS_URL=${REDIS_URL}
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Trading API configuration
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://api.alpaca.markets}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      # Security configuration
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Performance configuration
      - WORKERS=${WORKERS:-4}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-100}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-30}
      # Feature flags
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_PROFILING=${ENABLE_PROFILING:-false}
    volumes:
      # Mount logs directory
      - ./logs:/app/logs
      # Mount data directory for persistent storage
      - ./data:/app/data
    networks:
      - quantchain-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: quantchain-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-quantchain}
      - POSTGRES_USER=${POSTGRES_USER:-quantchain}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      # Mount PostgreSQL data directory
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - quantchain-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER:-quantchain}", "-d", "${POSTGRES_DB:-quantchain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quantchain-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      # Mount Redis data directory
      - redis_data:/data
    networks:
      - quantchain-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: quantchain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates (if using HTTPS)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Mount static files
      - ./static:/var/www/static:ro
    networks:
      - quantchain-network
    depends_on:
      - quantchain

  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: quantchain-monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"  # Grafana
      - "9090:9090"  # Prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      # Mount monitoring configuration
      - ./monitoring/grafana:/etc/grafana
      - ./monitoring/prometheus:/etc/prometheus
    networks:
      - quantchain-network

  backup:
    image: postgres:15-alpine
    container_name: quantchain-backup
    restart: "no"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-quantchain}
      - POSTGRES_USER=${POSTGRES_USER:-quantchain}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
    volumes:
      - ./backups:/backups
    networks:
      - quantchain-network
    depends_on:
      - postgres
    command: >
      sh -c "
      while true; do
        timestamp=$$(date +%Y%m%d_%H%M%S);
        pg_dump -h postgres -U ${POSTGRES_USER:-quantchain} -d ${POSTGRES_DB:-quantchain} > /backups/backup_$$timestamp.sql;
        echo 'Backup created at $$(date)';
        find /backups -name 'backup_*.sql' -mtime +7 -delete;
        sleep 86400;
      done"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  quantchain-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
