name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull_requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        id: pr-size
        run: |
          # Get PR diff and count characters
          DIFF_CHARS=$(gh pr diff ${{ github.event.pull_request.number }} | wc -c)
          echo "diff-chars=$DIFF_CHARS" >> $GITHUB_OUTPUT
          echo "PR diff has $DIFF_CHARS characters"

          # Set threshold (150,000 characters as per Claude Code Action limit)
          THRESHOLD=150000
          if [ $DIFF_CHARS -gt $THRESHOLD ]; then
            echo "exceeds-limit=true" >> $GITHUB_OUTPUT
            echo "PR exceeds character limit for automated review"
          else
            echo "exceeds-limit=false" >> $GITHUB_OUTPUT
            echo "PR within character limit for automated review"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on large PR
        if: steps.pr-size.outputs.exceeds-limit == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🔍 Claude Code Review Skipped

This PR exceeds the 150,000 character limit for automated code review (${{ steps.pr-size.outputs.diff-chars }} characters).

**Recommendations:**
- Consider breaking this into smaller, focused PRs
- Ensure each PR addresses a single feature or concern
- This helps maintain thorough code review quality

If this PR must remain large, please request a manual code review from maintainers.

---
*This automated check helps ensure comprehensive reviews for all changes.*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code Review
        id: claude-review
        if: steps.pr-size.outputs.exceeds-limit == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

