name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt
        # Install ib_async conditionally (requires Python >=3.10)
        if [ "${{ matrix.python-version }}" = "3.9" ]; then
          echo "Skipping ib_async installation for Python 3.9"
        else
          pip install "ib_async>=1.0.0"
        fi
        pip install -e .[backtesting,data,llm]

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check .

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=quantchain --cov-report=xml --cov-report=term

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt
        # Install ib_async for Python 3.13 (supported)
        pip install "ib_async>=1.0.0"
        pip install -e .[backtesting,data,llm]

    - name: Run integration tests
      run: |
        python -m pytest -m "integration and not slow" --cov=quantchain --cov-report=xml --cov-report=term
