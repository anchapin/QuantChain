name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel --no-cache-dir
        
        # Install core dependencies first
        pip install --no-cache-dir langchain openai pandas numpy pytest black flake8 PyYAML
        
        # Install gymnasium for FinRL adapter (needed for all versions)
        pip install --no-cache-dir gymnasium>=0.26.0
        
        # Install test dependencies including coverage
        pip install --no-cache-dir pytest-cov pytest-mock pytest-timeout
        
        # Install web dependencies for all Python versions since tests require them
        pip install --no-cache-dir streamlit plotly>=5.0.0 narwhals blinker
        
        # Install minimal CI dependencies to save disk space
        pip install --no-cache-dir -r requirements-ci.txt
        
        # Install ML dependencies only for specific Python versions (skip 3.10)
        if [ "${{ matrix.python-version }}" = "3.13" ]; then
          # Install full requirements for one Python version to test ML features
          pip install --no-cache-dir torch transformers --no-deps
          pip install --no-cache-dir peft datasets
          pip install --no-cache-dir sentence-transformers>=2.0.0 finrl>=0.3.0
        fi
        
        # Install ib_async conditionally (requires Python >=3.10)
        if [ "${{ matrix.python-version }}" = "3.9" ]; then
          echo "Skipping ib_async installation for Python 3.9"
        else
          pip install --no-cache-dir "ib_async>=1.0.0"
        fi
        pip install --no-cache-dir -e .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check .

    - name: Run unit tests
      run: |
        if [ "${{ matrix.python-version }}" = "3.13" ]; then
          # Run all tests for Python 3.13 (has ML dependencies installed)
          pytest tests/unit -v --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing
        else
          # Skip ML-dependent tests for other Python versions
          pytest tests/unit -v -m "not requires_ml" --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing
        fi

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      if: matrix.python-version == '3.13'  # Only upload coverage for one Python version
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel --no-cache-dir
        
        # Install core dependencies first
        pip install --no-cache-dir langchain openai pandas numpy pytest black flake8 PyYAML
        
        # Install gymnasium for FinRL adapter (needed for all versions)
        pip install --no-cache-dir gymnasium>=0.26.0
        
        # Install only essential dependencies for integration tests
        pip install --no-cache-dir -r requirements-dev.txt
        
        # Install web dependencies for integration tests 
        pip install --no-cache-dir streamlit plotly>=5.0.0 narwhals blinker
        
        # Install ML dependencies for integration tests (3.13 has enough space)
        pip install --no-cache-dir torch transformers --no-deps
        pip install --no-cache-dir peft datasets
        
        # Install ib_async for Python 3.13 (supported)
        pip install --no-cache-dir "ib_async>=1.0.0"
        pip install --no-cache-dir -e .

    - name: Run integration tests
      run: |
        python -m pytest -m "integration and not slow" -v --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
