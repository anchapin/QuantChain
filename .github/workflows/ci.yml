name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_DEFAULT_VERSION: "3.12"

jobs:
  # Single lint/format check job for all workflows
  lint-and-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install black flake8 isort mypy
          pip install -e .

      - name: Check code formatting with black
        run: black --check --diff .

      - name: Check import sorting with isort
        run: isort --check-only --diff .

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Type check with mypy
        run: |
          mypy quantchain --ignore-missing-imports || true

  # Core unit tests for all supported Python versions
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12"]

    name: Unit Tests (Python ${{ matrix.python-version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key:
            ${{ runner.os }}-pip-v2-unit-${{ matrix.python-version }}-${{
            hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-unit-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-v2-unit-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel --no-cache-dir

          # Install pytest and core testing dependencies
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist

          # Install essential core dependencies
          pip install "langchain>=0.2.0" "openai>=1.0.0" "pandas>=1.5.0" "numpy>=1.24.0" "PyYAML>=6.0"

          # Install gymnasium for all versions
          pip install "gymnasium>=0.26.0"

          # Install project with optional dependencies
          pip install -e ".[data,agents,gymnasium]"

          # Install ib_async conditionally (requires Python >=3.10)
          if [ "${{ matrix.python-version }}" != "3.9" ]; then
            pip install "ib_async>=1.0.0" || echo "ib_async installation failed"
          fi

          # Clean up pip cache
          pip cache purge

      - name: Run unit tests
        run: |
          pytest tests/unit -v -m "unit and not requires_ml" \
            --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=80 \
            --dist=loadscope -n auto \
            --tb=short \
            --timeout=300 \
            --ignore=tests/unit/agents/test_memecoin_vibe_trader.py

      - name: Upload coverage reports
        uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
        if: matrix.python-version == '3.12' # Only upload coverage for one version
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ML tests for Python 3.13 (latest version with most resources)
  ml-tests:
    runs-on: ubuntu-latest
    needs: lint-and-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]

    name: ML Tests (Python ${{ matrix.python-version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key:
            ${{ runner.os }}-pip-v2-ml-${{ matrix.python-version }}-${{
            hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-ml-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-v2-ml-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel --no-cache-dir

          # Install pytest and testing dependencies
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist

          # Install core dependencies
          pip install "langchain>=0.2.0" "openai>=1.0.0" "pandas>=1.5.0" "numpy>=1.24.0" "PyYAML>=6.0"

          # Install gymnasium
          pip install "gymnasium>=0.26.0"

          # Install all optional dependencies
          pip install -e ".[full]"

          # Install ML-specific dependencies
          pip install torch --no-deps || echo "Torch installation failed"
          pip install transformers --no-deps || echo "Transformers installation failed"
          pip install sentence-transformers || echo "Sentence-transformers installation failed"
          pip install peft datasets || echo "PEFT/datasets installation failed"

          # Install ib_async
          pip install "ib_async>=1.0.0" || echo "ib_async installation failed"

          # Clean up pip cache
          pip cache purge

      - name: Run ML tests
        run: |
          pytest tests/unit -v -m "requires_ml or slow" \
            --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=75 \
            --dist=loadscope -n auto \
            --tb=short \
            --timeout=600

      - name: Upload ML coverage reports
        uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
        with:
          files: ./coverage.xml
          flags: mltests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Integration tests on Python 3.13 (latest version)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]

    name: Integration Tests (Python ${{ matrix.python-version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key:
            ${{ runner.os }}-pip-v2-integration-${{ matrix.python-version }}-${{
            hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-integration-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-v2-integration-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel --no-cache-dir

          # Install pytest and testing dependencies
          pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist

          # Install core dependencies
          pip install "langchain>=0.2.0" "openai>=1.0.0" "pandas>=1.5.0" "numpy>=1.24.0" "PyYAML>=6.0"

          # Install core dependencies needed for integration tests
          pip install -e ".[data,agents,gymnasium]"

          # Install ML dependencies with no-deps to avoid conflicts
          pip install torch --no-deps || echo "Torch installation failed"
          pip install transformers --no-deps || echo "Transformers installation failed"
          pip install sentence-transformers || echo "Sentence-transformers installation failed"

          # Install ib_async (requires Python >=3.10)
          pip install "ib_async>=1.0.0" || echo "ib_async installation failed"

          # Install additional ML packages
          pip install peft datasets || echo "PEFT/datasets installation failed"

          # Clean up pip cache
          pip cache purge

      - name: Run integration tests
        run: |
          pytest tests/unit -v -m "integration and not slow" \
            --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=75 \
            --dist=loadscope -n auto \
            --tb=short \
            --timeout=300

      - name: Upload integration coverage reports
        uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
        if: false # Disable coverage upload for integration tests to avoid duplicates
        with:
          files: ./coverage.xml
          flags: integration
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build and package validation
  build-and-package:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    name: Build Package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('**/pyproject.toml') }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build package
        run: |
          python -m build

      - name: Store package artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-packages
          path: dist/
          retention-days: 30
