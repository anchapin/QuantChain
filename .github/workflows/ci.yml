name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10', 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-

    - name: Free up disk space
      run: |
        # Clean up unnecessary files to free disk space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        docker system prune -af --volumes || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        python -m pytest --cov=quantchain --cov-report=xml --cov-report=html --cov-fail-under=75

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Black (code formatting)
      run: black --check --diff quantchain tests

    - name: Run Flake8 (linting)
      run: flake8 quantchain tests --max-line-length=88 --extend-ignore=E203,W503

    - name: Run MyPy (type checking)
      run: mypy quantchain --ignore-missing-imports

    - name: Run Sourcery (code review)
      run: |
        pip install sourcery-cli
        sourcery review quantchain tests || echo "Sourcery found issues - will fix in separate PR"

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Free up disk space
      run: |
        # Clean up unnecessary files to free disk space
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        docker system prune -af --volumes || true

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log disk space pre-build
      run: |
        echo "=== Pre-build disk space ==="
        df -h
        docker system df

    - name: Test Docker build with optimizations
      run: |
        # Use minimal requirements for faster CI builds
        echo "Using CI requirements for faster build..."
        cp requirements-ci.txt requirements.txt
        
        # Build with resource limits and proper error handling
        echo "Starting Docker build..."
        if docker buildx build \
          --load \
          --memory=1g \
          --progress=plain \
          -t quantchain:test \
          --file Dockerfile.ci \
          .; then
          echo "Docker build successful"
        else
          echo "Docker build failed, checking system resources..."
          df -h
          docker system df
          echo "Build logs:"
          docker buildx build --progress=plain -t quantchain:test --file Dockerfile.ci . 2>&1 | tail -50
          exit 1
        fi

    - name: Verify image
      run: |
        echo "=== Verifying built image ==="
        docker images quantchain:test
        docker run --rm quantchain:test bash -c "cd /app && python -c \"import yaml, numpy; print('CI dependencies imported successfully')\""

    - name: Post-build cleanup
      run: |
        echo "=== Post-build cleanup ==="
        docker system prune -f --volumes || true
        df -h
