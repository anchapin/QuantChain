name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8

    - name: Install heavy dependencies
      run: |
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt

    - name: Run Black (code formatting)
      run: black --check --diff quantchain tests

    - name: Run Flake8 (linting)
      run: flake8 quantchain tests --max-line-length=88 --extend-ignore=E203,W503

    - name: Run MyPy (type checking)
      run: mypy quantchain --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8

    - name: Install heavy dependencies
      run: |
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m pytest -m "not slow and not integration" --cov=quantchain --cov-report=xml --cov-report=term --timeout=240

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: [3.12, 3.13]

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8

    - name: Install heavy dependencies
      run: |
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt
        # Install optional dependencies for integration tests
        pip install -e .[backtesting,data,llm]

    - name: Run integration tests
      run: |
        python -m pytest -m "integration and not slow" --cov=quantchain --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-slow-tests')
    strategy:
      matrix:
        python-version: [3.12, 3.13]

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install langchain openai pandas numpy pytest black flake8

    - name: Install heavy dependencies
      run: |
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt
        # Install all optional dependencies for slow tests
        pip install -e .[full]

    - name: Run slow tests
      run: |
        python -m pytest -m "slow" --cov=quantchain --cov-report=xml --cov-report=term

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format, unit-tests, integration-tests]
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: production

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install basic dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install build twine

    - name: Install heavy dependencies
      run: |
        pip install torch transformers streamlit plotly --no-deps
        pip install -r requirements.txt

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --skip-existing

    - name: Create Docker image tag
      run: |
        echo "DOCKER_TAG=ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}" >> $GITHUB_ENV
        echo "DOCKER_TAG_LATEST=ghcr.io/${{ github.repository }}:latest" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@f4ef78c080cd8ba56a744a68f54a16ee8216102
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t $DOCKER_TAG -t $DOCKER_TAG_LATEST .
        docker push $DOCKER_TAG
        docker push $DOCKER_TAG_LATEST

    - name: Deploy to production (notification)
      run: |
        echo "🚀 QuantChain v${{ github.event.release.tag_name }} deployed successfully!"
        echo "📦 PyPI: https://pypi.org/project/quantchain/"
        echo "🐳 Docker: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}"
