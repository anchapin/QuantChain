name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-lint-${{ hashFiles('**/requirements-dev.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install black flake8 mypy
        pip install -e .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check formatting with black
      run: |
        black --check .

    - name: Type check with mypy
      run: |
        mypy quantchain --ignore-missing-imports || true  # Allow to pass for now

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-unit-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-unit-
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        
        # Install pytest and core testing dependencies
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
        
        # Install essential core dependencies
        pip install langchain openai pandas numpy PyYAML
        
        # Install project with all optional dependencies
        pip install -e ".[data,agents,gymnasium]"
        
        # Install ib_async conditionally (requires Python >=3.10)
        if [ "${{ matrix.python-version }}" != "3.9" ]; then
          pip install "ib_async>=1.0.0"
        fi
        
        # Clean up pip cache
        pip cache purge

    - name: Run unit tests
      run: |
        pytest tests/unit -v -m "unit and not requires_ml and not slow" \
          --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
          --cov-fail-under=80 --dist=loadscope -n auto

    - name: Upload coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      if: matrix.python-version == '3.12'  # Only upload coverage for one version
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  ml-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]  # Only run ML tests on one version to save resources

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-ml-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-ml-
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        
        # Install pytest and testing dependencies
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
        
        # Install core dependencies
        pip install langchain openai pandas numpy PyYAML
        
        # Install all optional dependencies
        pip install -e ".[full]"
        
        # Install ML-specific dependencies
        pip install torch transformers --no-deps
        pip install peft datasets
        
        # Install ib_async
        pip install "ib_async>=1.0.0"
        
        # Clean up pip cache
        pip cache purge

    - name: Run ML tests
      run: |
        pytest tests/unit -v -m "requires_ml or slow" \
          --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
          --cov-fail-under=80 --dist=loadscope -n auto

    - name: Upload ML coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-integration-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-integration-
          ${{ runner.os }}-pip-v2-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        
        # Install pytest and testing dependencies
        pip install pytest pytest-cov pytest-mock pytest-timeout pytest-xdist
        
        # Install core dependencies
        pip install langchain openai pandas numpy PyYAML
        
        # Install all optional dependencies including web
        pip install -e ".[full]"
        
        # Install ML dependencies for integration tests
        pip install torch transformers --no-deps
        pip install peft datasets
        
        # Install ib_async
        pip install "ib_async>=1.0.0"
        
        # Clean up pip cache
        pip cache purge

    - name: Run integration tests
      run: |
        pytest tests/unit -v -m "integration and not slow" \
          --cov=quantchain --cov-report=xml --cov-report=html --cov-report=term-missing \
          --cov-fail-under=80 --dist=loadscope -n auto

    - name: Upload integration coverage reports
      uses: codecov/codecov-action@9cc74bf7e13a810454a28846494ddbc3795eb693
      if: false  # Disable coverage upload for integration tests to avoid duplicates
      with:
        files: ./coverage.xml
        fail_ci_if_error: false