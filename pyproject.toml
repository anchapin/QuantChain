[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantchain"
version = "0.1.0"
description = "A financial framework for building quantitative trading agents"
authors = [
    {name = "QuantChain Team", email = "team@quantchain.dev"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langchain>=0.1.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-mock>=3.10.0",
    "pre-commit>=3.0.0",
]
core = [
    "langgraph>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
]
backtesting = [
    "backtesting>=0.35.0",
]
llm = [
    "vllm>=0.3.0",
    "ollama>=0.1.0",
]
data = [
    "alpaca-py>=1.0.0",
    "ccxt>=4.0.0",
]
web = [
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantchain*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=quantchain --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
]
