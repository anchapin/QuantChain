[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantchain"
version = "0.1.0"
description = "A financial framework for building quantitative trading agents"
authors = [
    {name = "QuantChain Team", email = "team@quantchain.dev"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "langchain>=0.1.0",
]

[project.optional-dependencies]
# Core runtime dependencies
core = [
    "langgraph>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.21.0",
    "PyYAML>=6.0.0",
    "pandas>=1.21.0",
    "requests>=2.25.0",
]

# Testing dependencies
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

# Development and linting dependencies
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.25.0",
]

# All development dependencies combined
all-dev = [
    "quantchain[core,test,dev]",
]

# Backtesting dependencies
backtesting = [
    "backtesting>=0.35.0",
]

# LLM serving dependencies
llm = [
    "vllm>=0.3.0",
    "ollama>=0.1.0",
]

# Data connector dependencies
data = [
    "alpaca-py>=1.0.0",
    "ccxt>=4.0.0",
]

# Web dashboard dependencies
web = [
    "streamlit>=1.20.0",
    "plotly>=5.0.0",
]

# Complete installation with all optional features
full = [
    "quantchain[core,test,dev,backtesting,llm,data,web]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantchain*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=quantchain --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
]
