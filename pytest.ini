[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --tb=short
    -v
    --cov=quantchain
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

markers =
    unit: Unit tests
    integration: Integration tests
    requires_ml: Tests that require ML dependencies (torch, transformers, etc.)
    slow: Tests that take a long time to run
    network: Tests that require network access
    requires_web: Tests that require web browser or web interface
    coverage: Tests related to coverage measurement

# Coverage configuration
[coverage:run]
source = quantchain
omit = 
    */tests/*
    */test_*
    */conftest.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */virtualenv/*
    */site-packages/*
    quantchain/__init__.py
    quantchain/cli.py
    quantchain/main.py
    quantchain/examples/*
    quantchain/demos/*
    quantchain/benchmarks/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
