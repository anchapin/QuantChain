[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_plotly: marks tests that require plotly
    requires_streamlit: marks tests that require streamlit
    requires_torch: marks tests that require torch
    requires_transformers: marks tests that require transformers
    requires_web: marks tests that require web dashboard dependencies (streamlit, plotly)
    coverage: mark test as additional coverage test