# Multi-Agent System Configuration for QuantChain
# This configuration file demonstrates the setup for the TradingAgents integration

# Core configuration
llm:
  provider: "ollama"  # Options: ollama, openai, anthropic, vllm
  model: "llama2:7b"  # Model name based on provider
  api_key: ""  # API key for remote providers
  max_tokens: 1000
  temperature: 0.7

# Multi-agent system configuration
agents:
  # Portfolio Committee (Coordinator)
  portfolio_committee:
    max_debate_rounds: 3
    consensus_threshold: 70.0  # Minimum consensus score to proceed
    voting_weights:
      fundamentals_analyst: 0.25
      sentiment_expert: 0.20
      technical_analyst: 0.25
      risk_manager: 0.30
    enable_dispute_resolution: true
    tie_breaker_role: "risk_manager"

  # Fundamentals Analyst Configuration
  fundamentals_analyst:
    min_data_quality_score: 70.0
    pe_ratio_thresholds:
      overvalued: 30
      undervalued: 10
    debt_to_equity_limit: 2.0
    roe_threshold: 15.0
    required_data_sources:
      - "financial_statements"
      - "earnings_reports"
      - "market_data"
    confidence_threshold: 70.0

  # Sentiment Expert Configuration
  sentiment_expert:
    analysis_timeframe_hours: 24
    min_mentions_threshold: 10
    sentiment_thresholds:
      bullish: 30
      bearish: -30
    influencer_min_followers: 10000
    required_data_sources:
      - "news"
      - "social_media"
    confidence_threshold: 65.0

  # Technical Analyst Configuration
  technical_analyst:
    timeframes: ["1h", "4h", "1d"]
    indicators:
      SMA:
        periods: [20, 50, 200]
      RSI:
        period: 14
      MACD:
        fast: 12
        slow: 26
        signal: 9
      BB:
        period: 20
        std: 2
      ATR:
        period: 14
    patterns:
      - "head_and_shoulders"
      - "double_top"
      - "double_bottom"
      - "triangle"
      - "flag"
    min_data_points: 50
    required_data_sources:
      - "market_data"
      - "technical_indicators"
    confidence_threshold: 75.0

  # Risk Manager Configuration
  risk_manager:
    max_portfolio_risk: 0.02  # 2% max portfolio risk
    max_position_size: 0.05   # 5% max single position
    max_sector_exposure: 0.25 # 25% max sector exposure
    min_liquidity_score: 30.0
    max_leverage: 1.0
    stop_loss_atr_multiplier: 2.0
    position_sizing_method: "volatility"  # Options: fixed, kelly, volatility
    required_data_sources:
      - "portfolio_data"
      - "market_data"
      - "risk_metrics"
    confidence_threshold: 80.0

# Data connectors configuration
connectors:
  # Financial data for fundamentals
  alpha_vantage:
    api_key: "${ALPHA_VANTAGE_API_KEY}"
    base_url: "https://www.alphavantage.co/query"
    timeout: 30
    retry_attempts: 3

  # Market data for technical analysis
  alpaca:
    api_key: "${ALPACA_API_KEY}"
    api_secret: "${ALPACA_API_SECRET}"
    base_url: "https://paper-api.alpaca.markets"  # Use paper trading
    timeout: 30
    retry_attempts: 3

  # News data for sentiment analysis
  news_api:
    api_key: "${NEWS_API_KEY}"
    base_url: "https://newsapi.org/v2"
    timeout: 30
    retry_attempts: 3

  # Social media data (placeholder)
  social_media:
    platforms: ["twitter", "reddit"]
    rate_limit: 100  # requests per hour
    timeout: 30

# RAG System (optional - for enhanced context)
rag:
  enabled: true
  persist_directory: "./data/market_data"
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 1000
  chunk_overlap: 200

# Trading execution configuration
execution:
  provider: "alpaca"  # Options: alpaca, paper, simulation
  paper_trading: true
  commission_per_trade: 1.0
  slippage_model: "fixed"
  slippage_percent: 0.1

# Backtesting configuration
backtesting:
  engine: "vector"  # Options: vector, finrl
  initial_capital: 100000
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  benchmark: "SPY"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/trading_agents.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5

# Performance monitoring
monitoring:
  enable_metrics: true
  metrics_port: 8080
  enable_profiling: false
  log_performance: true

# Security configuration
security:
  encrypt_api_keys: true
  key_rotation_days: 90
  audit_logging: true
  session_timeout: 3600