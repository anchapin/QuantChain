codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    patch:
      default:
        target: 80%
        informational: false
        threshold: 1%
    project:
      default:
        target: 80%
        informational: false
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/*"
  - "test_*"
  - "**/conftest.py"
  - "**/__pycache__/**"
  - "**/migrations/**"
