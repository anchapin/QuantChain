codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    patch:
      default:
        target: 70%
        informational: true
    project:
      default:
        target: 75%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/*"
  - "test_*"
  - "**/conftest.py"
  - "**/__pycache__/**"
  - "**/migrations/**"
